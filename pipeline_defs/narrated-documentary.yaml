name: narrated-documentary
version: "2.0"
description: >
  AI-primary narrated documentary pipeline for tech disaster content. Segments a
  narrated script into scenes, generates voice-over, builds an Asset Bible (one
  canonical reference image per recurring location/subject) for cross-shot
  consistency, then generates AI video as the PRIMARY visual for every segment via a
  two-phase render package: prep (per-shot keyframes + hero clips + a shot
  manifest) followed by a bulk Grok image-to-video job via Kie.ai (cloud, no GPU
  box). Real
  archival footage (CSB, NTSB) is reserved for genuine historical events and is the
  fallback when AI generation fails. Detects sentence boundaries for pacing and
  assembles a pacing-aware timeline with establishing/escalation/crisis/resolution beats.
category: custom
stability: beta
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_tools:
    - video_analyzer
    - template_extractor

orchestration:
  mode: executive-producer
  budget_default_usd: 5.00
  max_revisions_per_stage: 2
  max_send_backs: 2
  max_wall_time_minutes: 120

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: true

required_skills:
  - pipelines/narrated-documentary/research-director
  - pipelines/narrated-documentary/segment-director
  - pipelines/narrated-documentary/asset-bible-director
  - pipelines/narrated-documentary/voice-gen-director
  - pipelines/narrated-documentary/ai-visual-director
  - pipelines/narrated-documentary/footage-search-director
  - pipelines/narrated-documentary/scoring-director
  - pipelines/narrated-documentary/gap-fill-director
  - pipelines/narrated-documentary/audio-analysis-director
  - pipelines/narrated-documentary/music-select-director
  - pipelines/narrated-documentary/assembly-director
  - pipelines/narrated-documentary/render-director
  - pipelines/narrated-documentary/review-director
  - pipelines/narrated-documentary/export-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  custom_allowed: true

stages:
  - name: research
    skill: pipelines/narrated-documentary/research-director
    produces:
      - research_brief
    required_artifacts_in: []
    optional_artifacts_in:
      - video_template
    tools_available:
      - web_search
      - transcript_fetcher
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Primary source identified, downloaded, and READ (page-cited extraction, not a summary)
      - Timeline events carry source citations
      - Stakeholder names verified against primary source
      - At least 10 data points with source URLs (target 35+)
      - Primary-credibility data points carry page_or_section cites
      - Unverifiable claims and cross-source conflicts flagged
    success_criteria:
      - research_brief schema valid
      - lib/research_vetter.py lint passes (counts, citations, diversity, page-cite rule)
      - primary_source identified
      - timeline_events >= 5 with citations
      - adversarial depth vet (vet_brief) run and gaps addressed or consciously accepted

  - name: segment
    skill: pipelines/narrated-documentary/segment-director
    produces:
      - segment_plan
    required_artifacts_in:
      - research_brief
    optional_artifacts_in:
      - video_template
    tools_available:
      - script_segment
      - template_applier
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Each scene has a rich prose visual_description, not bare keywords
      - AI-primary segments use type ai_video with ai_motion/ai_style (and shots for long beats)
      - Recurring locations/subjects carry a location_id or asset_ref for the Asset Bible
      - Real historical events with named victims use archival_footage, not ai_video
      - Narration claims trace to research_brief data_points
      - Pacing types follow establishing/escalation/crisis/resolution vocabulary
      - Scenes carry narration_mode and rhythm where the beat earns it (Scene Library, skills/creative/scene-library.md); blanks fall back to the emotional defaults
      - First ~15s segments tagged retention_beat cold_open then value_proposition
      - A retention_beat pattern_interrupt lands at least every ~90s of runtime
    success_criteria:
      - Schema-valid segment_plan artifact
      - Every scene has narration, visual_description, pacing, and a visual type
      - Scene durations sum to target video length within 10%

  - name: script
    skill: pipelines/narrated-documentary/script-director
    produces:
      - scored_script
    required_artifacts_in:
      - research_brief
    optional_artifacts_in:
      - segment_plan
    tools_available:
      - script_segment
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Narration tells a story — no scene-opening date/location slates; anchors sparse and mid-flow
      - Every factual claim traces to research_brief; adversarial fact vetting has zero criticals
      - Narration<->visual binding passes lib/narration_gate.py (no mismatches)
      - Multi-beat narration arcs have authored shots or an explicit chaining decision
      - Pronunciation dictionary covers every technical term before voice generation
      - Style critic (lib/script_review.py) findings applied or consciously rejected
      - Scenes alternate narration_mode literal/evocative and set rhythm where natural (Scene Library, skills/creative/scene-library.md)
      - The cold_open carries cold_open then value_proposition retention_beats in the first ~15s
      - Every open_loop plant has a matching payoff later in the script — no unfired loops
    success_criteria:
      - Schema-valid scored_script artifact (scored_script.schema.json)
      - lib/narration_gate.py exits 0 on the script
      - lib/script_review.py reports no critical fact findings
      - Unfired open_loops are a blocking validation error (script_validator.py rejects any planted loop without a payoff)

  - name: asset_bible
    skill: pipelines/narrated-documentary/asset-bible-director
    produces:
      - asset_bible
    required_artifacts_in:
      - segment_plan
    tools_available:
      - nano_banana_image
      - image_selector
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every recurring location/subject has exactly one canonical reference image
      - Locked attributes and period constraints are period-accurate
      - Asset IDs resolve for every segment that references them (referential integrity)
      - Real historical people/events are NOT given AI canonical images
    success_criteria:
      - Schema-valid asset_bible artifact
      - Referential integrity passes (every asset_ref resolves)
      - A canonical reference image exists for each recurring asset

  - name: voice_gen
    skill: pipelines/narrated-documentary/voice-gen-director
    produces:
      - voice_manifest
    required_artifacts_in:
      - segment_plan
    tools_available:
      - elevenlabs_tts
      - tts_selector
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Pronunciation dictionary covers all acronyms and proper nouns
      - Audio files exist and play without artifacts
      - Segment durations match expected narration pacing
    success_criteria:
      - Schema-valid voice_manifest artifact
      - One audio file per scene with valid duration
      - No TTS mispronunciations flagged in post-generation check

  - name: ai_visual_gen
    skill: pipelines/narrated-documentary/ai-visual-director
    produces:
      - shot_manifest
      - ai_visual_assets
    required_artifacts_in:
      - segment_plan
      - asset_bible
      - voice_manifest
    tools_available:
      - image_selector
      - video_selector
      - nano_banana_image
      - grok_kie_video
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "Phase A (prep): keyframes + shot manifest built; hero clips (Grok i2v) generated for review"
      - Hero clips reviewed and approved BEFORE the bulk batch is paid for
      - Every shot anchored to its asset's canonical reference image (consistency)
      - Long segments split into multiple shots, never a single looped clip
      - "Phase B (cloud): bulk Grok i2v job run via Kie.ai; per-segment concat to exact duration; cost within budget"
    success_criteria:
      - Schema-valid shot_manifest artifact
      - Hero clips generated and approved at the human gate
      - One AI clip per AI segment after the bulk job, at the exact target duration

  - name: footage_search
    skill: pipelines/narrated-documentary/footage-search-director
    produces:
      - footage_candidates
    required_artifacts_in:
      - segment_plan
    tools_available:
      - corpus_builder
      - direct_clip_search
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "ARCHIVAL / FALLBACK ONLY: runs for archival_footage segments and AI-gen failures"
      - Disaster-specific sources (CSB, NTSB, archive) searched first
      - Real footage reserved for genuine historical events
      - Provenance (source, license) recorded for all candidates
    success_criteria:
      - Schema-valid footage_candidates artifact
      - Archival/fallback scenes have at least 2 candidate clips
      - Provenance recorded for all candidates

  - name: scoring
    skill: pipelines/narrated-documentary/scoring-director
    produces:
      - scoring_manifest
    required_artifacts_in:
      - segment_plan
      - footage_candidates
    tools_available:
      - layer1_metadata
      - layer2_siglip
      - layer3_gemini
      - decision_engine
      - source_priority
      - footage_db
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "ARCHIVAL / FALLBACK ONLY: ranks real archival/stock candidates among themselves"
      - Source quality weighting applied (investigation footage > general stock)
      - Authenticity preferred over polish for real-event footage
      - Runner-ups recorded for every fallback scene
    success_criteria:
      - Schema-valid scoring_manifest artifact
      - Every archival/fallback scene has a selected clip with composite score

  - name: gap_fill
    skill: pipelines/narrated-documentary/gap-fill-director
    produces:
      - gap_fill_report
    required_artifacts_in:
      - ai_visual_assets
    tools_available:
      - direct_clip_search
      - runway_gapfill
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "INVERTED: stock/archival fills gaps where AI generation failed, not the reverse"
      - Triggered only for segments with no usable AI clip
      - Selected stock matches the visual register of the AI-generated material
    success_criteria:
      - Schema-valid gap_fill_report artifact
      - Every gap segment has a fallback clip with output_path recorded

  - name: audio_analysis
    skill: pipelines/narrated-documentary/audio-analysis-director
    produces:
      - sentence_map
    required_artifacts_in:
      - voice_manifest
    tools_available:
      - sentence_detect
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Sentence boundaries align with natural speech pauses
      - Whisperx fallback used when primary detection is ambiguous
      - Timestamps are sample-accurate (within 50ms tolerance)
    success_criteria:
      - Schema-valid sentence_map artifact
      - Every scene has at least one sentence boundary
      - Start/end timestamps are monotonically increasing within each scene

  - name: music_select
    skill: pipelines/narrated-documentary/music-select-director
    produces:
      - music_manifest
    required_artifacts_in:
      - segment_plan
    tools_available:
      - music_select
      - music_gen
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Local music_library/ checked before API generation
      - Mood matches the segment plan tone and pacing
      - Multiple options presented to user for approval
    success_criteria:
      - Schema-valid music_manifest artifact
      - At least one track selected with mood and duration
      - Track duration covers the full video length

  - name: assembly
    skill: pipelines/narrated-documentary/assembly-director
    produces:
      - assembly_manifest
    required_artifacts_in:
      - ai_visual_assets
      - gap_fill_report
      - sentence_map
      - music_manifest
    tools_available:
      - pacing_engine
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - AI segment clips and any archival/stock fallback clips placed on the timeline
      - Pacing follows establishing/escalation/crisis/resolution arc
      - Source audio muted (volume=0) on all footage clips
      - L/J-cuts present at sentence boundaries
      - Scene audio_transition tags honored at the cut — j_cut/l_cut/sound_bridge used where set (Scene Library, skills/creative/scene-library.md)
      - Aspect ratio normalization applied to all clips
    success_criteria:
      - Schema-valid assembly_manifest artifact
      - Every cut has scene_id, source, in/out points, volume, and framing
      - Timeline duration matches voice-over duration within 2 seconds

  - name: render
    skill: pipelines/narrated-documentary/render-director
    produces:
      - render_report
    required_artifacts_in:
      - assembly_manifest
    tools_available:
      - video_compose
      - audio_mixer
      - color_grade
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Render completed without unintended fallback
      - Color grade pass applied uniformly across timeline
      - Output duration matches assembly plan within 1 second
      - Audio levels are balanced (voice over music, no clipping)
    success_criteria:
      - Schema-valid render_report artifact
      - Output file exists and passes ffprobe validation
      - Duration matches assembly_manifest total within 1 second

  - name: review
    skill: pipelines/narrated-documentary/review-director
    produces:
      - review_report
    required_artifacts_in:
      - render_report
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Weak clips flagged with specific scene_id and reason
      - Swap candidates suggested (regenerate AI shot or use archival fallback)
      - Review completed within 10-15 minute target window
    success_criteria:
      - Schema-valid review_report artifact
      - Status is either approved or revision_needed
      - All flagged scenes have actionable notes

  - name: export
    skill: pipelines/narrated-documentary/export-director
    produces:
      - publish_log
    required_artifacts_in:
      - review_report
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - SEO title follows tech disaster naming convention
      - Description includes chapter markers with timestamps
      - Tags cover disaster name, industry, and general documentary terms
    success_criteria:
      - Schema-valid publish_log artifact
      - Title is under 100 characters and includes the disaster name
      - Description has at least 3 chapter markers
