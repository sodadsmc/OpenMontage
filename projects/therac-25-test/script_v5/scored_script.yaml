- id: seg_026
  act: act_4
  narration: >
    The first was a race condition. Setting up the beam takes
    the machine about eight seconds. And the screen lets an
    operator keep typing while it works. Type X-ray by mistake.
    Catch it. Cursor up, fix it to electron — all inside those
    eight seconds. The screen takes the correction. The turntable
    follows it. But the beam setting never hears about the
    change… It stays locked at X-ray strength. A hundred times
    the current of an electron treatment.
  visual:
    description: >
      Race condition animation — two parallel timelines:
      'Software state' and 'Hardware state' diverging.
      Software shows one mode, hardware stays in another.
    type: manim_animation
    template: race_condition
    must_show:
