- id: seg_031
  act: act_4
  narration: >
    Both bugs had been there all along. Hiding in the code,
    waiting — for an operator to type fast enough, for a counter
    to land on zero. The race condition was older than the
    Therac-25 itself: carried in, line by line, from machines a
    decade before. And every time the screen said Malfunction
    fifty-four, operators pressed P. They proceeded. Because no
    manual explained it. Because stops like it were everyday
    noise — one clinic logged forty in a single day. Because the
    machine itself had trained them to ignore it.
