    In Tyler, Fritz Hager doesn't let it go. After hours, he sits
    at the machine with the operator, and she re-types her exact
    keystrokes. Again. And again. It takes practice — but then it
    comes: Malfunction fifty-four, on demand. Speed is the
    trigger. AECL's engineers can't reproduce it… until they're
    told to type fast. Then they find it, buried in the code.
    And it isn't alone. The software carries two bugs.
