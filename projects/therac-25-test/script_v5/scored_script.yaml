  editorial_intent: technical_explanation
  pacing: escalation

- id: seg_027
  act: act_4
  narration: >
    The machine fires the full-power beam with no target and no
    flattening filter. Directly into the patient. And the chambers
    that measure dose can't keep up. They saturate — and report
    almost nothing. The machine doesn't even know what it's done.
  visual:
