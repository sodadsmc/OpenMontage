- id: seg_028
  act: act_4
  narration: >
    The second bug was an arithmetic overflow. Deep in the setup
    routine, the software tracked one safety check with a counter
    called Class Three. The counter was a single byte. One byte.
    A maximum value of two hundred and fifty-five. Every pass of
    the routine pushed it up by one. And at two hundred and
    fifty-five, the next push didn't raise an error. It rolled
    over… to zero.
  visual:
    description: >
      Byte overflow animation — a single byte counter
      incrementing: 253, 254, 255... then rolling to 0.
      The moment the safety check vanishes.
    type: manim_animation
    template: byte_overflow
    must_show:
    - counter_incrementing
    - rollover_to_zero
    - safety_flag_clearing
    animation_phases:
    - phase: counting
      description: "Counter incrementing normally, slow build"
      target_duration_pct: 60
    - phase: overflow
      description: "255 → 0 — the critical moment"
      target_duration_pct: 20
    - phase: consequence
      description: "Zero = 'all safe' — beam fires"
      target_duration_pct: 20
  editorial_intent: technical_explanation
  pacing: escalation

- id: seg_029
  act: act_4
  narration: >
    Zero. The value that told the software: nothing needs
    checking. For that one pass in every two hundred and
    fifty-six, the turntable check simply vanished. If the
    operator pressed the set button at that exact moment… the
    software saw no reason to stop. The interlocks were satisfied.
    The beam fired — turntable out of position, target out of
    the path. That is the bug that came back for Yakima, in the
    dead of winter. For Glen Dodd. And there was no hardware
    interlock left to catch it. AECL had removed them.
  visual:
    description: >
      Counter reads 0. Green 'SAFE' indicator illuminates.
      Beam fires. The false safety signal.
    type: manim_animation
    template: byte_overflow
    must_show:
