# -----------------------------------------------------------------------
# ACT 1: THE VICTIM
# -----------------------------------------------------------------------

segments:
- id: seg_001
  act: act_1
  narration: >
    It's a June morning in nineteen eighty-five. Katherine
    Yarbrough — Katie — arrives for a follow-up radiation
    treatment. She is sixty-one years old, and she knows
    the procedure. You lie on the table. The technician positions
    the machine. You hold still. It takes a few seconds. You don't
    feel much of anything.
  visual:
    description: >
      A lone woman, seen from behind, walks the long empty 1985 hospital
      corridor toward the distant treatment-room door - small against the
      receding hallway, routine and unhurried. The camera follows her in
      one continuous take.
    type: ai_video
    location_id: kennestone_corridor
    reference_period: "1985"
    ai_motion: "she walks steadily away from the camera down the corridor, unhurried, routine; the camera follows her at walking pace in one continuous take, the distant treatment-room door slowly growing nearer; fluorescent light pools sliding over her as she passes beneath each fixture; the corridor's geometry stays rigid and constant; OBJECT PERMANENCE: nothing appears, vanishes, or changes anywhere in the corridor - every object stays exactly where it started, and stretches of corridor revealed by the camera are bare walls and floor only"
    ai_style: "quiet dread beneath total routine - an ordinary morning, a walk she has made before, the door waiting at the end; soft clinical light, oppressive calm"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Graphic-novel illustration. A lone anonymous elderly woman in a
        modest 1980s coat, seen FROM BEHIND, walks away from the camera
        down a long empty 1985 hospital corridor - her figure small against
        the receding perspective of pale walls, speckled linoleum, and
        humming fluorescent fixtures. A single empty wheelchair parked against the left wall near the
        camera - no other furniture, the walls bare except their handrails,
        the rest of the corridor empty. At the far end: a closed double treatment-room door,
        distant. Her posture is unhurried, routine. Face never visible. No
        other people. Strictly period detail, no modern signage, no legible
        text anywhere.
      duration_weight: 1.0
      hero: true
    ai_fallback_prompt: >
      A lone woman seen from behind walking a long empty 1985 hospital
      corridor toward a distant door.
  music:
    state: playing
    description: "Low tension drone, barely audible"
  editorial_intent: establishing_atmosphere
  pacing: establishing

- id: seg_002
  act: act_1
  narration: >
    The machine is called the Therac-25. It's the newest of its
    kind — more compact, more versatile, run entirely by computer.
    And it is trusted completely. Even when it lies.
  visual:
    description: >
      A treatment room. The Therac-25 machine looming
      overhead. Oppressive, clinical atmosphere.
    type: ai_video
    uniqueness: unique
    location_id: kennestone_treatment_room
    reference_period: "1985"
    ai_motion: "the machine is COMPLETELY STILL - a fixed, rigid object with no moving parts; the camera alone moves, a slow smooth orbital arc around the room with the machine locked dead-center in frame, perspective shifting gently as the camera circles; a single small status light blinks; deep shadows hold their shapes; no zoom, no tilt, the machine never changes form"
    ai_style: "cold clinical lighting, looming dread, oppressive"
    shots:
    - shot_id: shot_01
      ai_prompt: "interior of a 1980s radiation therapy treatment room, the Therac-25 — a massive beige machine, its smooth rounded-top housing and projecting beam head looming over an empty treatment table, cold fluorescent light"
      duration_weight: 1.0
      hero: true
    search_queries:
    - "radiation therapy treatment room 1980s"
    - "linear accelerator patient table medical"
    ai_fallback_prompt: >
      Interior of a 1980s radiation therapy treatment room,
      large medical machine looming over an empty treatment
      table, clinical lighting, institutional feel
  music:
    state: continue
  editorial_intent: building_trust
  pacing: establishing

- id: seg_003
  act: act_1
  narration: >
    The technician enters the prescription. The machine fires.
    Katie Yarbrough feels something she's never felt before.
    A tremendous force of heat — a red-hot searing across her
    shoulder. You burned me, she tells the technician. And the
    technician tells her that is not possible. Something is wrong.
    She knows it immediately.
  visual:
    description: "An illustrated older woman on the treatment table, a sharp flinch of pain - the moment a routine turns wrong."
    type: ai_video
    location_id: kennestone_treatment_room
    reference_period: "1985"
    ai_motion: >-
      at frame-left the technician's fingers strike down across the console keyboard entering the prescription; an instant later the Therac-25 beam head fires through the doorway behind him — a hard amber-white shaft snaps down across the patient's shoulder and the air blooms hot; her body wrenches in a sharp flinch and her hand jerks up toward the burn, mouth opening in a cry; the technician's head turns back over his shoulder toward her. A slow tracking drift from console to table links cause to harm in one continuous move.
    ai_style: "graphic-novel illustration (inked, painterly, period palette) — cold clinical dread tipping into private terror, the instant a routine turns wrong; intimate, airless, helpless. Illustrated character, never photoreal."
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Graphic-novel illustration, not photoreal — inked, painterly, 1985 period, deep navy and warm amber duotone. Wide two-figure composition inside the Kennestone radiation-therapy treatment room. In the near foreground at frame-left, an illustrated radiation technician stands hunched at the boxy beige Therac-25 control console, both hands on a period mechanical keyboard, fingers mid-press as he enters the prescription; the console face throws a soft amber glow up onto his jaw and forearms — the screen and a curl of printed paper rendered as impressionistic amber light and indistinct glowing shapes, absolutely NO legible numbers, letters, words, symbols, or readouts anywhere. Beyond him, framed through the heavy treatment-room threshold at frame-right, an illustrated older woman with soft grey hair lies on the radiation-therapy table; the beige-painted Therac-25 beam head looms over her and FIRES — a hard, narrow shaft of searing amber-white light striking down across her shoulder, the air around the beam blooming hot, her body wrenching in a sharp flinch, one hand jerking up toward the burn, mouth open mid-cry. The technician's head is just beginning to turn back over his shoulder toward her, caught between the console and the table — the calm hand at the keyboard and the harm it triggers held in one frame. Period 1985 hardware only — machined metal, painted beige enamel, knurled knobs, coiled cables trailing into shadow; no flatscreen, no LED, no digital readout. Low three-quarter angle, shallow depth of field, the background machinery dissolving into navy black. Two illustrated figures only, anonymous, never photoreal, restrained cel-style shading, inked linework, muted period palette. No legible text, no captions baked into the image, no photographic skin texture.
      duration_weight: 1.0
      hero: false
    ai_fallback_prompt: "An illustrated older woman on the treatment table, a sharp flinch of pain - the moment a routine turns wrong."
  music:
    state: change
    description: "Drone deepens"
  editorial_intent: crisis_moment
  pacing: escalation

  narration_mode: literal
- id: seg_004
  act: act_1
  narration: >
    She's just received fifteen to twenty thousand rads of
    radiation. A typical treatment dose is about two hundred.
  visual:
    description: "Analog dose meter needle slamming past the danger arc - a dose that should never read this high."
    type: ai_video
    reference_period: "1985"
    ai_motion: "the black needle jerks off rest and is driven violently across the dial, slamming hard against the end stop and quivering there, pinned, unable to read any higher; the amber pilot lamp flares and pulses as it pegs; a slow, unsettling push in toward the pinned needle, faint dust drifting through the cold highlight, the deep shadows breathing almost imperceptibly"
    ai_style: "cold clinical horror — an instrument pushed catastrophically past its limit and stuck there, the quiet dread of a measurement that should never read this high; moody, oppressive, duotone-friendly with a single amber glow against encroaching navy dark, clean darker lower third for the caption"
    shots:
    - shot_id: shot_01
      ai_prompt: "A single 1985-era analog radiation dose meter filling most of the frame in a dim equipment room — a boxy beige enameled instrument with a convex glass-covered dial and a slender black needle. The needle is driven hard over to the far right of the arc, pinned against the end stop, far past a faint red danger arc on the dial face. The dial is rendered impressionistically: tick marks and a sweeping scale arc as indistinct shapes and a faint amber glow — absolutely NO legible numbers, letters, words, or symbols anywhere on the dial, the casing, or the room, no markings that resolve as readable text of any kind. A small amber pilot lamp glows beside the dial. The instrument's curved glass catches a thin cold highlight; the rest of the casing and the room behind sink into deep navy shadow, the lower third of the frame falling almost entirely to clean darkness with no objects or clutter, leaving room for a caption. Period 1985 hardware only — machined metal bezel, knurled knob, screw terminals, a coiled cable trailing off into shadow; no flatscreen, no LED, no digital readout. Low three-quarter angle, the pinned needle the focal point, shallow depth of field, background machinery dissolving into black. No people, no hands, no on-screen text or captions baked into the image."
      duration_weight: 1.0
      hero: false
    text_overlay:
    - "TYPICAL DOSE: 200 RAD"
    - "DELIVERED:"
    - "15,000-20,000 RAD"
    text_emphasis: 2
    ai_fallback_prompt: "Analog dose meter needle slamming past the danger arc - a dose that should never read this high."
  silence_after_s: 2
  editorial_intent: emotional_impact
  pacing: crisis

- id: seg_005
  act: act_1
  narration: >
    That's up to one hundred times the intended dose. And the
    machine? It noticed nothing. The console stayed calm. The
    printer that would have recorded the dose sat disabled.
    As far as the Therac-25 knew… the treatment had gone
    exactly to plan.
  visual:
    description: >
      The control terminal serene in the foreground, reporting a normal
      treatment, while beyond the open doorway behind it the patient on the
      table flinches under the Therac-25 - the machine's lie and its cost
      held in one frame.
    type: ai_video
    location_id: therac_terminal
    support_asset_refs:
    - loc_kennestone_treatment_room
    reference_period: "1985"
    ai_motion: "the amber cursor blinks on, steady and serene, a soft pulse of light crossing the placid screen; far beyond the doorway the small figure on the table stiffens and flinches once; a very slow unsettling push past the calm screen toward the doorway"
    ai_style: "cold clinical serenity that reads as horror, the obscene calm of a machine reporting normal, oppressive quiet"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Deep-focus dramatic-irony composition in the 1985 operator alcove.
        FOREGROUND right: the boxy beige control terminal large in frame, its
        convex glass face glowing serene amber - dense blurred indistinct
        monospace, no legible words, one steady blinking block cursor; calm,
        orderly, untroubled. BACKGROUND left, seen through the open
        treatment-room doorway and far smaller: the Therac-25 - its rounded
        beige housing and beam head over the treatment table - where an
        anonymous illustrated patient in a hospital gown stiffens mid-flinch,
        hands gripping the table edge. The bright untroubled screen and the
        distant suffering held in the same frame, the terminal indifferent.
        Strictly period hardware, no flatscreen, no LED, no mouse pointer or arrow cursor (block cursor only), no legible text
        anywhere. Low over-the-desk angle past the terminal toward the
        doorway, deep depth of field.
      duration_weight: 1.0
      hero: false
    text_overlay:
    - "THE MACHINE RECORDED"
    - "NOTHING WRONG"
    text_emphasis: 1
    ai_fallback_prompt: >
      A 1985 control terminal glowing calm amber in the foreground while a
      small patient flinches on the treatment table through the doorway behind.
  music:
    state: stop
  editorial_intent: institutional_critique
  pacing: crisis

- id: seg_006
  act: act_1
  narration: >
    No alarm. No error. No indication that anything had gone
    wrong at all. Over the next two years, this machine will
    overdose six patients in two countries. At least three of
    them will die of it. The company that built it will insist,
    again and again, that an overdose is impossible. And the
    answer will come down to a single byte of memory. How did
    this happen?
  visual:
    description: "The control terminal glowing calm - no alarm, no error, no indication."
    type: ai_video
    location_id: therac_terminal
    reference_period: "1985"
    ai_motion: >-
      The steel gantry and its boxy beam head physically pivot on their mount, swinging through a slow firing arc while the turntable assembly rotates into position with cold mechanical certainty — the apparatus actively going about its work, delivering. Across the convex glass the amber phosphor breathes in a faint steady shimmer and the cursor-glow holds a slow even blink, dust motes drifting through the warm light; the interface itself never reacts — no alarm, no flicker — even as the machine behind it keeps moving. The camera holds a locked low three-quarter framing (no dolly push, no zoom): the motion is the gantry firing and resetting, not the lens drifting toward an inert object.
    ai_style: "cold clinical serenity that reads as horror — the obscene calm of a machine reporting normal while catastrophe has already happened; oppressive quiet, a dead-still interface, the amber glow confined to the upper frame and a darker lower third swallowing the desk into near-black where the caption sits; period 1985, no legible text"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        A single 1985 radiation-therapy control terminal alone in a darkened equipment room — a boxy beige metal CRT with a convex glass face on a cluttered operator desk. The curved screen glows a calm, even amber phosphor reduced to a soft indistinct smear of light: no character shapes, no readable words, no rows of code, just a blurred warm wash and one steady block of cursor-glow — no warning band, no flashing, no alarm color, the obscene serenity of a machine reporting nothing wrong while, behind it, the accelerator head moves. In the mid-ground the heavy steel treatment gantry and its boxy beam head pivot on their mount, swinging slowly through their firing arc with mechanical certainty, the turntable assembly rotating into position with a cold deliberate motion — the apparatus dutifully going about its lethal work while the console face stays serene. Period 1985 hardware only: beige enamel casing, chunky keyboard, coiled phone cord, a folded fanfold printout, a heavy power toggle; no flatscreen, no LED, no modern UI. No people, no hands. The amber glow pools on the beige casing and rakes across the pivoting gantry in the upper-middle of frame and falls off fast; it never reaches the lower third, where the desk surface and the room sink into deep navy-to-black shadow — the bottom of the frame almost pure black where harm sits unrecorded, kept clear and uncluttered for the caption. Low three-quarter angle, the calm screen and the moving beam head dominating the upper-middle of frame, shallow depth, background machinery dissolving into darkness. Inked linework, restrained cel-style shading, deep navy #0a1428 and amber #e8a44c duotone, muted period palette, painterly graphic-novel rendering, no photographic texture, absolutely no legible text, letters, numbers, or symbols on the screen or any surface.
      duration_weight: 1.0
      hero: false
    text_overlay:
    - SIX OVERDOSED. TWO COUNTRIES.
    - AT LEAST THREE WILL DIE.
    - '"AN OVERDOSE IS IMPOSSIBLE."'
    - A SINGLE BYTE OF MEMORY.
    text_emphasis: 2
    ai_fallback_prompt: "The control terminal glowing calm - no alarm, no error, no indication."
  silence_after_s: 3
  editorial_intent: chapter_transition
  pacing: crisis

  # -----------------------------------------------------------------------
  # ACT 2: THE MACHINE
  # -----------------------------------------------------------------------

  narration_mode: literal
- id: seg_007
  act: act_2
  narration: >
    The Therac-25 had two ways to fire a beam. One of them could
    kill. In electron mode, a low-power beam treats the patient
    directly. In X-ray mode, the beam runs about a hundred times
    stronger. It fires into a metal target, and the target turns
    that force into X-rays. The target takes the punishment. The
    patient gets the treatment. Two modes. One machine. And
    everything depends on the target being exactly where it's
    supposed to be.
  visual:
    description: >
      Animated diagram of the Therac-25 linear accelerator.
      Must show the turntable mechanism with both the target
      and the scanning magnets. NOT a generic linac.
    type: manim_animation
    template: radiation_therapy
    must_show:
    - electron_gun
    - turntable_with_target
    - turntable_with_scanning_magnets
    - patient_position
    animation_phases:
    - phase: build_diagram
      description: "Components appear one by one as narrated"
      target_duration_pct: 60
    - phase: show_two_modes
      description: "Turntable rotates between electron and X-ray modes"
      target_duration_pct: 40
  music:
    state: playing
    description: "Neutral, methodical, slight unease underneath"
  editorial_intent: technical_explanation
  pacing: establishing

- id: seg_008
  act: act_2
  narration: >
    Previous models — the Therac-6 and the Therac-20 — used
    hardware safety interlocks. Physical metal. Fuses, switches,
    mechanical locks that wouldn't let the beam fire unless the
    target sat in its proper place.
  visual:
    description: >
      Inside an earlier linac chassis: a heavy electromechanical
      safety interlock — physical metal that made overdose impossible.
    type: ai_video
    reference_period: "1985"
    ai_motion: "the steel cam rotates against the microswitch and the lever snaps, the solenoid plunger drives home and gears turn; a slow macro push to the contact point"
    ai_style: "grave mechanical reassurance shading into dread, the quiet authority of solid metal, cold and exacting"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Extreme close-up inside the open metal chassis of an earlier-generation
        medical linear accelerator: a heavy electromechanical safety interlock — a
        machined-steel cam riding a microswitch lever, a chunky solenoid plunger, a
        return spring, exposed gear teeth — physically gating a beam-stop arm. A
        tungsten target disc on a metal turntable in shadow. Period hardware:
        machined metal, relays, a ribbon wiring harness, screw terminals; purely
        mechanical, over-engineered, tactile. Tight three-quarter macro, shallow
        depth, the contacts in crisp focus, the cabinet falling into deep shadow.
        No screens, no text, no people.
      duration_weight: 1.0
      hero: false
    ai_fallback_prompt: >
      Macro of a mechanical safety interlock inside a 1980s linac — steel cam,
      microswitch, spring, gears; no people, no text.
  editorial_intent: technical_explanation
  pacing: establishing

- id: seg_009
  act: act_2
  narration: >
    The Therac-25's manufacturer — a company called AECL —
    removed them. It was a deliberate decision: the hardware
    seemed redundant, an expense the software made unnecessary.
    AECL trusted its code that much. Nearly every safety check
    now lived in software alone. Software written in PDP-11
    assembly language. By a single programmer. Over several years.
  visual:
    description: >
      A single 1985 terminal alone in the dark, dense amber code
      scrolling — every safety check now living only in software.
    type: ai_video
    location_id: therac_terminal
    reference_period: "1985"
    ai_motion: >-
      The gloved hands draw the metal interlock block straight up and out of its bracket, the bolt clearing the socket and the loose cable swinging free, revealing the empty bracket and bare bolt-hole as the metal leaves frame; in the background the seated programmer's hand presses across the keyboard and the amber code on the CRT advances a few lines; a slow, steady handheld settle — no push into a still screen.
    ai_style: "cold clinical isolation, the quiet weight of unwatched machinery, creeping dread — a single fragile light holding back the dark"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        A darkened 1985 medical-equipment bay rendered in inked, painterly amber-and-deep-navy duotone (navy #0a1428, amber #e8a44c), no photographic texture, 1985 period hardware only. In the foreground, a pair of gloved technician hands grips a heavy machined metal safety-interlock block and lifts it free of its mounting bracket on an open beige cabinet panel, leaving a bare bolt-hole socket and a clean rectangular shadow where the metal sat; a loosened bolt and an unplugged thick cable hang loose. Behind, deeper in the bay, a lone programmer sits in silhouette at a single boxy beige PDP-11-era control terminal, one hand resting on the chunky keyboard, the curved-glass CRT throwing an amber phosphor glow of dense indistinct monospace lines — deliberately illegible, impressionistic, no readable words or numbers. The screen glow and a single hard overhead pool of light are the only illumination, carving figure and metal out of the dark; the rest of the cabinet rack recedes into navy shadow. Anonymous illustrated figures, no real-person likeness, no faces emphasized. No flatscreen, no LED.
      duration_weight: 1.0
      hero: false
    ai_fallback_prompt: >
      A lone 1985 CRT terminal in the dark, indistinct amber code scrolling,
      period hardware, no people.
    text_overlay:
    - HARDWARE INTERLOCKS REMOVED
    - PDP-11 ASSEMBLY — ONE PROGRAMMER
  music:
    state: change
    description: "Single low note, sustained"
  editorial_intent: escalation
  pacing: escalation

  narration_mode: literal
- id: seg_010
  act: act_2
  narration: >
    Years before the machine hurt a single patient, AECL ran a
    safety analysis on the Therac-25. That analysis apparently
    excluded the software entirely.
  visual:
    description: >
      A thick 1980s safety report under a hard lamp — dense type up
      top, a conspicuously blank lower band: the analysis never done.
    type: ai_video
    reference_period: "1985"
    ai_motion: "a typewriter hammers dense analysis line by line down the page, each line struck with a small ink-jolt and the carriage nudging then snapping back; the type reaches a bold SOFTWARE heading and STOPS dead — keys freeze, carriage halts mid-travel — and the lower third stays a stark blank band under the lamp; a slow push-in onto the empty field as the typing dies"
    ai_style: "cold clinical dread, institutional weight, the quiet of a deliberate absence"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Extreme top-down close-up of one open page of a thick ring-bound 1980s
        institutional engineering safety report on a bare metal desk under a single
        hard overhead pool of light, the rest in deep shadow. The upper two-thirds is
        dense, cramped typewriter-style monospace and a faint ruled grid —
        impressionistic, never sharp enough to read, type fading into grain. The lower
        third is conspicuously bare: a wide band of clean untouched paper where the
        rows simply stop. A heavy ring-binder spine crowds the top of frame. Shallow
        depth, the empty band in sharpest focus. Typewritten/mimeographed look only,
        no laser type, no screens, no people, no hands.
      duration_weight: 1.0
      hero: false
    ai_fallback_prompt: >
      Top-down on a 1980s bound safety report under a desk lamp, dense type above
      and a blank lower band, no people.
  silence_after_s: 1
  editorial_intent: institutional_critique
  pacing: escalation

  # -----------------------------------------------------------------------
  # ACT 3: THE PATTERN
  # -----------------------------------------------------------------------

- id: seg_011
  act: act_3
  narration: >
    What happened to Katie Yarbrough… happened again. And again.
    In hospital after hospital, for nearly two years.
  visual:
    description: "A records room of identical repeating forms - not an isolated incident."
    type: ai_video
    reference_period: "1985"
    ai_motion: "a slow steady push glides forward over the front rows of identical paper while the receding grid of repeating forms seems to multiply deeper into the dark, the hard overhead light drifting almost imperceptibly across the curling edges, faint dust hanging in the beam, and one quiet rhythmic settle of the topmost sheet — dynamic but grounded, the lower third holding still, empty and dark for the caption."
    ai_style: "cold clinical dread, institutional repetition turning ominous — the quiet horror of the same identical thing reproduced again and again into shadow; oppressive, hushed, restrained and uncluttered, period 1985, with a clean darker lower third; graphic-novel atmosphere, no photographic texture, absolutely no legible text."
    shots:
    - shot_id: shot_01
      ai_prompt: "Tight, slow push down a dim 1985 institutional records room where identical sheets of period paper repeat into the dark — the same treatment-record form and the same fan-fold printout, laid out and overlapping in a receding grid that multiplies toward the shadowed background, sameness and oppressive repetition carrying the whole image. The forms are visually identical, one after another after another, the same shape and the same faint ruled framing on each. CRITICAL: there is NO legible text anywhere in the frame. The typing on every sheet is reduced to an abstract soft grey rhythm of ink — blurred horizontal smudges and faint pale bands suggesting rows of monospace, never resolving into a single readable character, word, number, letterhead, or form label. Treat the writing as texture, not language. A single hard overhead pool of light rakes across only the front rows of paper, catching paper fibre and curling edges; the rows recede and dissolve into deep navy-dark shadow at the back and especially across the lower third of the frame, leaving a clean, empty, darker band beneath where nothing competes. Keep it restrained and uncluttered — a few crisp front sheets, then quiet softening copies, not a busy wall of detail. Strictly period 1985: manual-typewriter, carbon-copy and mimeograph look, off-white and pale-blue carbon paper, NO laser print, NO screens, NO LED, NO barcodes, NO modern paper or fonts. No people, no hands, no faces. Low three-quarter angle looking down the repeating rows, shallow depth, the nearest identical form in crisp focus and the multiplying copies softening into the dark. Moody, oppressive, clinical stillness; the dread of the same thing happening again and again. Graphic-novel illustrated atmosphere, no photographic texture."
      duration_weight: 1.0
      hero: false
    text_overlay:
    - "NOT AN ISOLATED INCIDENT."
    - "THE PATTERN"
    text_emphasis: 1
    ai_fallback_prompt: "A records room of identical repeating forms - not an isolated incident."
  music:
    state: playing
    description: "Tension begins — slow, rhythmic pulse"
  editorial_intent: chapter_transition
  pacing: establishing

- id: seg_012
  act: act_3
  narration: >
    It starts with Katie Yarbrough, the woman on the table in
    Georgia. Up to twenty thousand rads, against a typical dose
    of two hundred. Her hospital's physicist — a man named Tim
    Still — is the first to ask whether the machine could have
    burned her. He puts the question to AECL. Three days later,
    the company's engineers call back: not possible. There's no
    investigation. Just a phone call.
  visual:
    description: >
      The phone call that closed the case — Tim Still's question to AECL,
      dismissed as 'not possible,' no investigation.
    type: ai_video
    reference_period: "1985"
    ai_motion: "a hand lifts the heavy black rotary receiver, the finger hooks the dial and drags it fully around and it whirs back, the man leans in to ask; then he listens, his shoulders slowly drop, and the receiver is set back into the cradle, the cord swaying then stilling and the dial spinning to rest — the question asked and waved away; a slow push tightening onto the dead phone"
    ai_style: "cold institutional dismissal — a life-and-death question closed with a single phone call; the quiet weight of a warning ignored, oppressive stillness"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Graphic-novel illustration. A dim 1985 hospital physicist's desk: a heavy black
        ROTARY desk telephone in a pool of warm lamplight, its coiled cord trailing, the
        handset just being set back into the cradle by an anonymous hand in a plain shirt
        cuff — no face, partial figure only. Around it a blotter, a closed manila folder, a
        coffee cup, scattered notes, all rendered impressionistically. The rest of the
        office falls into deep navy shadow. The phone is the focal point — the moment the
        call ends and nothing happens. Bold black ink linework, cross-hatch and halftone
        shading, warm amber on deep navy. Strictly 1985 hardware, no modern phone, no
        flatscreen, no LED, no legible text anywhere.
      duration_weight: 1.0
