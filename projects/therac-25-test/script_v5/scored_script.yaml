      description: "Show normal operation — both timelines in sync"
      target_duration_pct: 25
    - phase: race
      description: "Operator types fast — timelines diverge"
      target_duration_pct: 50
    - phase: consequence
      description: "Software shows safe, hardware is wrong"
      target_duration_pct: 25
  music:
