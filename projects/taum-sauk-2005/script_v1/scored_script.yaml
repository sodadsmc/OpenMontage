- id: seg_023
  act: act_5
  narration: >
    The investigation took a year, and it did not find a villain in the
    control room. It found the villain in the design of trust. Sensors
    nobody re-anchored. A software offset instead of a repair. Warning
    probes wired to stay silent. A fail-safe set above the top of a
    sinking wall. Someone had hollowed out every layer of protection,
    one reasonable decision at a time. And the paperwork knew.
  visual:
    description: >
      The forensic documents: report covers, tabbed pages, the margin
      sketch again, spread under cold light; a slow indicting pan.
    type: ai_video
    location_id: office_paper
    reference_period: "2006"
    ai_motion: "slow pan across an array of thick technical reports, tabbed and flagged, an engineering cross-section drawing and photographs of a breached dam among them, under cold fluorescent light"
    ai_style: "the reckoning as paperwork; forensic and final"
    shots:
    - shot_id: shot_01
      ai_prompt: >-
        Graphic-novel illustration. Thick bound technical reports with
        colored page tabs spread on a table with engineering drawings and
        aerial photographs of a breached mountaintop reservoir, cold
        fluorescent office light. All text unreadable greek. No people.
      duration_weight: 1.0
      hero: true
    ai_fallback_prompt: >
      Technical reports and drawings spread on a table under office light.
  music:
    state: playing
    description: "Measured, judicial"
  editorial_intent: institutional_critique
