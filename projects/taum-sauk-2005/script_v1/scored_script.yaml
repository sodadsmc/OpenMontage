    record for dam safety. It paid roughly one hundred eighty million
    more to the state of Missouri. They rebuilt the reservoir in solid concrete. The new instruments
    cross-check each other. The new rim gives water somewhere to go. It went back online in twenty ten.
  visual:
    description: >
