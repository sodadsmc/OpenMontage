- id: seg_026
  act: act_5
  narration: >
    Because here is the lesson, and it is not about dams. The computer
    did exactly what it was told. The sensors reported faithfully from where they
    lay — pipes that had drifted out of place. Every part told its own small truth, and the whole
    system lied. Somebody saw Niagara Falls and typed point four feet
    into a config file. The gap between those two things is where
    disasters live.
  visual:
    description: >
      Return to the master diagram, simplified to its essence: the gap
      between TRUE and BELIEVED, held; then the amber CRT alone in the
      dark.
    type: manim_animation
    template: sensor_gap
    must_show:
    - true_vs_indicated_level
    - the_gap_held
    animation_phases:
    - phase: essence
      description: "Everything fades but the two level lines and the gap between them"
      target_duration_pct: 60
    - phase: gap_holds
      description: "The gap pulses once on 'where disasters live'"
      target_duration_pct: 40
  music:
    state: playing
    description: "The thesis, stated plainly"
  editorial_intent: institutional_critique
  pacing: resolution
  retention_beat: payoff
  silence_after_s: 1

