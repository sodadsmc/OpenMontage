<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenMontage — Scene Review</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">OpenMontage <span class="muted">· scene review</span></div>
    <div id="summary" class="summary"></div>
  </header>

  <main id="app">
    <section id="detail" class="detail">
      <p class="muted">Loading…</p>
    </section>
    <section class="gridwrap">
      <div class="gridhead">All scenes <span class="muted" id="gridcount"></span></div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
